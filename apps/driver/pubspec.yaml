name: cakecity_driver
description: Cake City secure driver operations app.
publish_to: none
version: 2.0.0+31
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  http: ^1.3.0
  image_picker: ^1.1.2
  signature: ^5.5.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
# path_provider_android 2.3.x introduced a JNI Gradle plugin that is not
# compatible with the generated stable Flutter Android project yet.
dependency_overrides:
  path_provider_android: 2.2.23
flutter:
  uses-material-design: true
