services:
  - type: web
    name: cakecity-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: python migrate.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cakecity-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cakecity-redis
          property: connectionString
      - fromGroup: cakecity-secrets
      - key: SECURE_COOKIES
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: ALLOWED_ORIGINS
        value: '["https://app.cakecity.co.ke","https://admin.cakecity.co.ke"]'
      - key: PUBLIC_API_URL
        value: https://cakecity-api.onrender.com
      - key: STOREFRONT_URL
        value: https://app.cakecity.co.ke
  - type: worker
    name: cakecity-worker
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cakecity-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cakecity-redis
          property: connectionString
      - fromGroup: cakecity-secrets
  - type: keyvalue
    name: cakecity-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: allkeys-lru
databases:
  - name: cakecity-postgres
    plan: basic-256mb
    databaseName: cakecity
    user: cakecity
envVarGroups:
  - name: cakecity-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: WOOCOMMERCE_WEBHOOK_SECRET
        sync: false
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@cakecity.co.ke
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
