services:
  - type: web
    name: cakecity-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: python migrate.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cakecity-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cakecity-redis
          property: connectionString
      - fromGroup: cakecity-secrets
      - key: SECURE_COOKIES
        value: true
      - key: PUBLIC_API_URL
        value: https://cakecity-api.onrender.com
      - key: STOREFRONT_URL
        value: https://app.cakecity.co.ke
  - type: worker
    name: cakecity-worker
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cakecity-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cakecity-redis
          property: connectionString
      - fromGroup: cakecity-secrets
  - type: keyvalue
    name: cakecity-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: allkeys-lru
databases:
  - name: cakecity-postgres
    plan: basic-256mb
    databaseName: cakecity
    user: cakecity
envVarGroups:
  - name: cakecity-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: WOOCOMMERCE_WEBHOOK_SECRET
        sync: false
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
