name: Verify Cake City
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @cakecity/web exec tsc --noEmit
      - run: pnpm --filter @cakecity/admin exec tsc --noEmit
      - run: pnpm --filter @cakecity/kitchen exec tsc --noEmit
      - run: pnpm build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
  driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web --project-name cakecity_driver .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_URL=https://cakecity-api.onrender.com
      - run: flutter build apk --release --dart-define=API_URL=https://cakecity-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: cakecity-driver-v0.9.0
          path: |
            apps/driver/build/app/outputs/flutter-apk/app-release.apk
            apps/driver/build/web
