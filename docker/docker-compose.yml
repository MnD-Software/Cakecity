services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cakecity
      POSTGRES_USER: cakecity
      POSTGRES_PASSWORD: local-only
    ports: ["5432:5432"]
    volumes: [cakecity_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
  api:
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    working_dir: /app
    volumes:
      - ../backend/api/app:/app/app
      - ../backend/api/migrate.py:/app/migrate.py
      - ../database/migrations:/app/migrations
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://cakecity:local-only@postgres:5432/cakecity
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: local-development-access-secret-change-me
    depends_on: [postgres, redis, rabbitmq]
volumes:
  cakecity_pg:
